all_column_and_score_scalers_fit_on_pca_window = true

[pca_part_b]
mode = "expanding"
inner_window = "X[0:b)"
outer_window = "X[0:a)"
column_and_score_scalers_fit_expanding_not_recent_L = true
representation_common_across_finite_L = true

[representation]
fit_components_once_per_window = 8
solver = "deterministic_full_SVD"
smaller_K = "first_K_components_of_same_eight_component_fit"
