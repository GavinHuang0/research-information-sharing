[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorcast"
version = "0.1.0"
description = "Experiments on measurement panels and coefficient sharing in factor forecasts"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<4", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.scripts]
factorcast = "factorcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
