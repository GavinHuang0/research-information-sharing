name: Validate research scaffold

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-analysis-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m unittest discover -s tests -v
      - run: factorcast simulate --config configs/smoke.toml --output results/ci-smoke
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
  proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
      - run: make -B -C proposal
      - uses: actions/upload-artifact@v4
        with:
          name: research-proposal-pdf
          path: proposal/proposal.pdf
